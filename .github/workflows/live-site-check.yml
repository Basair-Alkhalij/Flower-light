name: Live site smoke check

on:
  workflow_run:
    workflows: ['Build, test and deploy Pages']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  live:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tests/live-site-smoke.mjs
        env:
          FL_SITE_URL: ${{ vars.FL_SITE_URL || 'https://basair-alkhalij.github.io/Flower-light/' }}
