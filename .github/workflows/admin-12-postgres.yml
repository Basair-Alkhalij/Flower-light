name: Admin 12-section isolated PostgreSQL review

on:
  pull_request:
    paths:
      - "supabase/PROPOSED_ADMIN_12_PERMISSIONS_REVIEW_ONLY.sql"
      - "tests/admin-12-db-fixture.sql"
      - "tests/admin-12-db-rules.sql"
      - ".github/workflows/admin-12-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-db:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 63
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flower_admin_review
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-not-a-real-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flower_admin_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: flower_admin_review
      PGUSER: postgres
      PGPASSWORD: test-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
      - name: Install psql client if needed
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Prepare synthetic roles and empty schemas
        run: psql -v ON_ERROR_STOP=1 -f tests/admin-12-db-fixture.sql
      - name: Apply proposed SQL only to disposable CI PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/PROPOSED_ADMIN_12_PERMISSIONS_REVIEW_ONLY.sql
      - name: Confirm isolation and no privilege escalation
        run: psql -v ON_ERROR_STOP=1 -f tests/admin-12-db-rules.sql
