name: Flower Light browser smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Read-only real-site Chromium check
        if: github.event_name == 'pull_request' && github.head_ref == 'verification/live-production-2026-11-01'
        run: node tests/live-browser-audit.mjs
      - name: Upload light and dark screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-screenshots
          path: test-results/theme-screens/*.png
          if-no-files-found: ignore
